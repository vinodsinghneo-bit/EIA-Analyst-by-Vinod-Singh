<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08101d" />
      <stop offset="100%" stop-color="#0f1c2e" />
    </linearGradient>
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />
  <!-- Abstract Energy Grid / Growth Lines -->
  <path d="M120 380 L200 280 L280 320 L380 180" stroke="#162537" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <path d="M120 340 L200 240 L280 280 L380 140" stroke="#1e293b" stroke-width="6" stroke-dasharray="10, 10" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <!-- Glowing Oil Droplet -->
  <path d="M256 90 C256 90 376 270 376 340 C376 406.27 322.27 460 256 460 C189.73 460 136 406.27 136 340 C136 270 256 90 256 90 Z" fill="url(#dropGrad)" filter="url(#glow)" />
  <!-- Inner Highlight -->
  <path d="M256 140 C256 140 330 280 330 330 C330 360 305 385 275 385 C260 385 256 380 256 370" stroke="rgba(255,255,255,0.4)" stroke-width="6" stroke-linecap="round" fill="none" />
</svg>
