name: Android Build and Upload

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up the Java environment
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. Allow GitHub Actions to run your gradle wrapper
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. Build the APK
      - name: Build with Gradle
        run: ./gradlew assembleDebug

      # 5. UPLOAD THE APK (This is the step that saves your file)
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-android-apk
          path: app/build/outputs/apk/debug/*.apk
